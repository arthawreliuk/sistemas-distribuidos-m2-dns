// ns3 — secundário autoritativo da zona sd.lab (idêntico ao ns2).
options {
    directory "/var/bind";     // gravável pelo usuário named (root:named 770)
    recursion no;
    allow-query { any; };

    // O BIND impõe mínimos para refresh/retry; sem estes ajustes os
    // temporizadores curtos do SOA (30 s / 10 s) seriam ignorados.
    min-refresh-time 10;
    min-retry-time 5;

    // Adaptação: secundários não reenviam NOTIFY aos demais servidores NS.
    // A replicação parte apenas do primário.
    notify no;
};

zone "sd.lab" {
    type secondary;
    primaries { 172.30.0.11; };   // endereço INTERNO do ns1
    file "db.sd.lab";              // relativo a /var/bind (fica no contêiner)
};
