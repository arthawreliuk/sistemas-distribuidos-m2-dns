<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Arquitetura do DNS</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <rect width="900" height="480" fill="#fff"/>

  <!-- Hierarquia -->
  <text x="20" y="26" font-weight="bold" font-size="14">(a) Espaço de nomes hierárquico: cada nível é uma zona delegada por registros NS</text>
  <g text-anchor="middle">
    <rect x="200" y="42" width="90" height="30" fill="#fff" stroke="#000"/><text x="245" y="62">. (raiz)</text>
    <rect x="90" y="102" width="80" height="30" fill="#fff" stroke="#000"/><text x="130" y="122">.com</text>
    <rect x="205" y="102" width="80" height="30" fill="#fff" stroke="#000"/><text x="245" y="122">.br</text>
    <rect x="320" y="102" width="80" height="30" fill="#fff" stroke="#000"/><text x="360" y="122">.lab</text>
    <rect x="175" y="162" width="140" height="30" fill="#fff" stroke="#000"/><text x="245" y="182">univali.br</text>
    <rect x="320" y="162" width="80" height="30" fill="#eee" stroke="#000" stroke-width="2"/><text x="360" y="182" font-weight="bold">sd.lab</text>
  </g>
  <g stroke="#000">
    <line x1="245" y1="72" x2="130" y2="102"/><line x1="245" y1="72" x2="245" y2="102"/><line x1="245" y1="72" x2="360" y2="102"/>
    <line x1="245" y1="132" x2="245" y2="162"/><line x1="360" y1="132" x2="360" y2="162"/>
  </g>
  <text x="440" y="122" font-size="12">Ninguém conhece a árvore inteira: cada servidor</text>
  <text x="440" y="138" font-size="12">conhece só a sua zona e as delegações para os filhos.</text>
  <text x="440" y="182" font-size="12">Zona do laboratório (sd.lab), detalhada em (b).</text>

  <!-- Zona -->
  <text x="20" y="232" font-weight="bold" font-size="14">(b) Dentro de uma zona: um primário, réplicas secundárias e resolvedores com cache</text>
  <g text-anchor="middle">
    <rect x="40" y="262" width="170" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="125" y="284" font-weight="bold">Primário (ns1)</text><text x="125" y="302">recebe as escritas</text><text x="125" y="316" font-size="11">(edição da zona + serial)</text>
    <rect x="320" y="250" width="170" height="44" fill="#fff" stroke="#000"/>
    <text x="405" y="268" font-weight="bold">Secundário (ns2)</text><text x="405" y="285" font-size="11">cópia somente leitura</text>
    <rect x="320" y="310" width="170" height="44" fill="#fff" stroke="#000"/>
    <text x="405" y="328" font-weight="bold">Secundário (ns3)</text><text x="405" y="345" font-size="11">cópia somente leitura</text>
    <rect x="600" y="262" width="150" height="60" fill="#fff" stroke="#000"/>
    <text x="675" y="284" font-weight="bold">Resolvedor</text><text x="675" y="302">recursivo</text><text x="675" y="316" font-size="11">com cache (TTL)</text>
    <rect x="800" y="270" width="80" height="44" fill="#fff" stroke="#000"/><text x="840" y="297">Clientes</text>
  </g>
  <line x1="210" y1="282" x2="318" y2="272" stroke="#000" marker-end="url(#a)"/>
  <line x1="210" y1="302" x2="318" y2="332" stroke="#000" marker-end="url(#a)"/>
  <text x="262" y="262" text-anchor="middle" font-size="11">NOTIFY</text>
  <path d="M318,284 C270,296 250,296 212,292" stroke="#000" fill="none" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <path d="M318,344 C270,340 250,330 212,314" stroke="#000" fill="none" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="262" y="356" text-anchor="middle" font-size="11">SOA? / AXFR / IXFR</text>
  <line x1="598" y1="292" x2="492" y2="272" stroke="#000" marker-end="url(#a)"/>
  <line x1="598" y1="292" x2="492" y2="332" stroke="#000" marker-end="url(#a)"/>
  <path d="M640,322 L640,374 L125,374 L125,326" stroke="#000" fill="none" stroke-dasharray="2 3" marker-end="url(#a)"/>
  <text x="545" y="250" text-anchor="middle" font-size="11">consultas (aa)</text>
  <line x1="798" y1="292" x2="752" y2="292" stroke="#000" marker-end="url(#a)"/>
  <text x="775" y="282" text-anchor="middle" font-size="11">rd</text>

  <g font-size="12">
    <text x="20" y="404">• Cliente-servidor em todas as interações (requisição-resposta): cliente → resolvedor → autoritativos.</text>
    <text x="20" y="424">• Replicação primário-backup por zona: só o primário aceita escrita; os secundários puxam a zona quando o serial aumenta.</text>
    <text x="20" y="444">• Escala por delegação (hierarquia) e por cache (o resolvedor responde sem consultar a hierarquia enquanto o TTL vale).</text>
    <text x="20" y="464">• Linha pontilhada: o resolvedor também pode consultar o primário, que é igualmente autoritativo para leitura.</text>
  </g>
</svg>
