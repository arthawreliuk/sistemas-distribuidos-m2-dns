<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Topologia do laboratório DNS (sd.lab)</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="setaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#000000">Laboratório DNS — zona sd.lab (BIND 9.18.49, Docker Compose, projeto sdm2dns)</text>

  <!-- Rede interna -->
  <rect x="40" y="60" width="820" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="56" y="84" font-weight="bold" fill="#000000">Rede interna — sdm2dns_interna — 172.30.0.0/24</text>
  <text x="56" y="104" fill="#000000" font-size="13">Somente replicação: NOTIFY (ns1 → secundários) e AXFR/IXFR (secundários ← ns1)</text>

  <!-- Rede de clientes -->
  <rect x="40" y="370" width="820" height="60" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="56" y="394" font-weight="bold" fill="#333333">Rede de clientes — sdm2dns_clientes — 172.31.0.0/24</text>
  <text x="56" y="414" fill="#333333" font-size="13">Consultas DNS (UDP/TCP 53): cliente → resolvedor → autoritativos; cliente → autoritativos (dig @IP)</text>

  <!-- Servidores autoritativos -->
  <g>
    <rect x="80" y="180" width="200" height="150" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="180" y="208" text-anchor="middle" font-weight="bold" font-size="17">ns1</text>
    <text x="180" y="230" text-anchor="middle">primário autoritativo</text>
    <text x="180" y="252" text-anchor="middle" font-size="12" fill="#444444">zona lida de ./zonas/db.sd.lab</text>
    <text x="180" y="280" text-anchor="middle" font-size="13" fill="#000000">int: 172.30.0.11</text>
    <text x="180" y="300" text-anchor="middle" font-size="13" fill="#333333">cli: 172.31.0.11</text>
  </g>
  <g>
    <rect x="350" y="180" width="200" height="150" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="450" y="208" text-anchor="middle" font-weight="bold" font-size="17">ns2</text>
    <text x="450" y="230" text-anchor="middle">secundário autoritativo</text>
    <text x="450" y="252" text-anchor="middle" font-size="12" fill="#444444">cópia em /var/bind/db.sd.lab</text>
    <text x="450" y="280" text-anchor="middle" font-size="13" fill="#000000">int: 172.30.0.12</text>
    <text x="450" y="300" text-anchor="middle" font-size="13" fill="#333333">cli: 172.31.0.12</text>
  </g>
  <g>
    <rect x="620" y="180" width="200" height="150" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="720" y="208" text-anchor="middle" font-weight="bold" font-size="17">ns3</text>
    <text x="720" y="230" text-anchor="middle">secundário autoritativo</text>
    <text x="720" y="252" text-anchor="middle" font-size="12" fill="#444444">cópia em /var/bind/db.sd.lab</text>
    <text x="720" y="280" text-anchor="middle" font-size="13" fill="#000000">int: 172.30.0.13</text>
    <text x="720" y="300" text-anchor="middle" font-size="13" fill="#333333">cli: 172.31.0.13</text>
  </g>

  <!-- ligações à rede interna -->
  <line x1="180" y1="140" x2="180" y2="180" stroke="#000000" stroke-width="2"/>
  <line x1="450" y1="140" x2="450" y2="180" stroke="#000000" stroke-width="2"/>
  <line x1="720" y1="140" x2="720" y2="180" stroke="#000000" stroke-width="2"/>
  <!-- replicação -->
  <path d="M180,125 L440,125" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#seta)" stroke-dasharray="6 4"/>
  <path d="M180,125 Q450,128 710,125" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#seta)" stroke-dasharray="6 4"/>
  <text x="480" y="119" font-size="12" fill="#000000">NOTIFY + transferência de zona</text>

  <!-- ligações à rede de clientes -->
  <line x1="180" y1="330" x2="180" y2="370" stroke="#555555" stroke-width="2"/>
  <line x1="450" y1="330" x2="450" y2="370" stroke="#555555" stroke-width="2"/>
  <line x1="720" y1="330" x2="720" y2="370" stroke="#555555" stroke-width="2"/>

  <!-- resolvedor e cliente -->
  <g>
    <rect x="200" y="460" width="220" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="310" y="486" text-anchor="middle" font-weight="bold" font-size="17">resolvedor</text>
    <text x="310" y="506" text-anchor="middle" font-size="13">recursivo com cache; forward only</text>
    <text x="310" y="526" text-anchor="middle" font-size="13" fill="#333333">cli: 172.31.0.53</text>
  </g>
  <g>
    <rect x="500" y="460" width="220" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="610" y="486" text-anchor="middle" font-weight="bold" font-size="17">cliente</text>
    <text x="610" y="506" text-anchor="middle" font-size="13">dig / scripts de medição</text>
    <text x="610" y="526" text-anchor="middle" font-size="13" fill="#333333">cli: 172.31.0.100</text>
  </g>
  <line x1="310" y1="430" x2="310" y2="460" stroke="#555555" stroke-width="2"/>
  <line x1="610" y1="430" x2="610" y2="460" stroke="#555555" stroke-width="2"/>
  <path d="M500,500 L425,500" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#setaAzul)"/>
  <text x="462" y="493" text-anchor="middle" font-size="11" fill="#333333">consulta</text>
</svg>
