<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Diagrama de sequência do E2</title>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <rect width="900" height="640" fill="#fff"/>
  <!-- participantes -->
  <g font-weight="bold" text-anchor="middle">
    <rect x="30" y="20" width="110" height="34" fill="#fff" stroke="#000"/><text x="85" y="42">cliente</text>
    <rect x="200" y="20" width="110" height="34" fill="#fff" stroke="#000"/><text x="255" y="42">resolvedor</text>
    <rect x="390" y="20" width="110" height="34" fill="#fff" stroke="#000"/><text x="445" y="42">ns1 (primário)</text>
    <rect x="580" y="20" width="110" height="34" fill="#fff" stroke="#000"/><text x="635" y="42">ns2</text>
    <rect x="760" y="20" width="110" height="34" fill="#fff" stroke="#000"/><text x="815" y="42">ns3</text>
  </g>
  <g stroke="#000" stroke-dasharray="4 4">
    <line x1="85" y1="54" x2="85" y2="582"/><line x1="255" y1="54" x2="255" y2="582"/>
    <line x1="445" y1="54" x2="445" y2="582"/><line x1="635" y1="54" x2="635" y2="582"/><line x1="815" y1="54" x2="815" y2="582"/>
  </g>

  <!-- Leitura -->
  <text x="20" y="80" font-weight="bold">Leitura (cache vazio)</text>
  <line x1="85" y1="98" x2="250" y2="98" stroke="#000" marker-end="url(#s)"/>
  <text x="168" y="92" text-anchor="middle">A? app.sd.lab (rd)</text>
  <path d="M255,118 L810,118" stroke="#000" fill="none" marker-end="url(#s)"/>
  <text x="530" y="112" text-anchor="middle">encaminha a um dos forwarders (nesta execução, ns3)</text>
  <path d="M815,138 L260,138" stroke="#000" fill="none" stroke-dasharray="6 3" marker-end="url(#s)"/>
  <text x="530" y="154" text-anchor="middle">resposta autoritativa (aa), TTL 60</text>
  <rect x="200" y="162" width="110" height="22" fill="#eee" stroke="#000"/><text x="255" y="177" text-anchor="middle">guarda no cache</text>
  <path d="M250,198 L90,198" stroke="#000" fill="none" stroke-dasharray="6 3" marker-end="url(#s)"/>
  <text x="168" y="214" text-anchor="middle">10.0.0.2, TTL 60 (ra, sem aa)</text>

  <text x="20" y="246" font-weight="bold">Leitura 2 s depois</text>
  <line x1="85" y1="262" x2="250" y2="262" stroke="#000" marker-end="url(#s)"/>
  <path d="M250,282 L90,282" stroke="#000" fill="none" stroke-dasharray="6 3" marker-end="url(#s)"/>
  <text x="168" y="298" text-anchor="middle">10.0.0.2, TTL 58 (do cache)</text>
  <text x="530" y="282" text-anchor="middle" font-style="italic">nenhum autoritativo é consultado</text>

  <!-- Escrita -->
  <text x="20" y="336" font-weight="bold">Escrita (somente no primário)</text>
  <rect x="355" y="346" width="180" height="40" fill="#eee" stroke="#000"/>
  <text x="445" y="362" text-anchor="middle">edita a zona, serial+1</text>
  <text x="445" y="378" text-anchor="middle">rndc reload; carrega (t = 0)</text>
  <line x1="445" y1="404" x2="630" y2="404" stroke="#000" marker-end="url(#s)"/>
  <text x="540" y="398" text-anchor="middle">NOTIFY (+3 ms)</text>
  <path d="M635,424 L450,424" stroke="#000" fill="none" marker-end="url(#s)"/>
  <text x="540" y="440" text-anchor="middle">pede IXFR (+8 ms)</text>
  <path d="M445,456 L630,456" stroke="#000" fill="none" stroke-dasharray="6 3" marker-end="url(#s)"/>
  <text x="540" y="472" text-anchor="middle">zona inteira (AXFR), 9 registros</text>
  <line x1="445" y1="500" x2="810" y2="500" stroke="#000" marker-end="url(#s)"/>
  <text x="700" y="494" text-anchor="middle">NOTIFY (+507 ms)</text>
  <path d="M815,520 L450,520" stroke="#000" fill="none" marker-end="url(#s)"/>
  <text x="700" y="536" text-anchor="middle">pede IXFR (+512 ms)</text>
  <path d="M445,552 L810,552" stroke="#000" fill="none" stroke-dasharray="6 3" marker-end="url(#s)"/>
  <text x="700" y="568" text-anchor="middle">zona inteira (AXFR), 9 registros</text>
  <text x="450" y="604" text-anchor="middle">Rede interna (172.30.0.0/24): NOTIFY e transferência.  Rede de clientes (172.31.0.0/24): consultas.</text>
  <text x="450" y="622" text-anchor="middle">Tempos a partir do instante em que o ns1 carregou a nova versão, segundo os logs do BIND (execução de 26/10/2026).</text>
</svg>
