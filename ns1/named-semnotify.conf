// ns1 sem NOTIFY — usado apenas na segunda série do E3. A propagação passa a
// depender do refresh do SOA nos secundários.
options {
    directory "/var/bind";
    recursion no;
    allow-query { any; };
    notify no;
    allow-transfer { 172.30.0.12; 172.30.0.13; };
};

zone "sd.lab" {
    type primary;
    file "/var/lib/bind/db.sd.lab";
};
