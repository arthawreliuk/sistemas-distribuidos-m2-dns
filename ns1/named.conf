// ns1 — primário autoritativo da zona sd.lab (roteiro, seção 5.2).
options {
    directory "/var/bind";
    recursion no;
    allow-query { any; };

    // Adaptação ao roteiro: o PDF usa "notify yes", que também notifica os
    // endereços dos registros NS (rede de clientes, 172.31.0.x). Com
    // "explicit", o NOTIFY vai SOMENTE para also-notify (rede interna), de modo
    // que todo o tráfego de replicação (NOTIFY + transferência) fica na rede
    // interna — pré-requisito para o experimento de partição (E6).
    notify explicit;
    also-notify { 172.30.0.12; 172.30.0.13; };

    // Transferência só para os endereços INTERNOS dos secundários.
    allow-transfer { 172.30.0.12; 172.30.0.13; };
};

zone "sd.lab" {
    type primary;
    file "/var/lib/bind/db.sd.lab";   // montado de ./zonas no host
};
