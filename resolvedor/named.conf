// resolvedor — recursivo com cache; encaminha sd.lab aos três autoritativos.
options {
    directory "/var/bind";
    recursion yes;
    allow-query { any; };
    dnssec-validation no;   // a zona do laboratório não é assinada
};

zone "sd.lab" {
    type forward;
    forward only;
    forwarders { 172.31.0.11; 172.31.0.12; 172.31.0.13; };
};
